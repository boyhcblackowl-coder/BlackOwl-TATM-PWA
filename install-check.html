<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c0d0f"><link rel="manifest" href="./manifest.webmanifest"><title>TA & TM — Install Check</title><style>body{font-family:Arial;background:#0c0d0f;color:#eee;padding:22px}.card{max-width:640px;margin:5vh auto;background:#181a1d;padding:25px;border:1px solid #665638;border-radius:17px}.ok{color:#64d39e}.fail{color:#ffb9a4}.muted{color:#a9a59c}.row{padding:10px 0;border-bottom:1px solid #36332c}button{padding:13px 20px;background:#d7b97c;border:0;border-radius:10px;font-weight:bold}</style></head><body><div class="card"><img src="./icon-192.png" alt="Black Owl" width="85"><h1>TA & TM — Install Check</h1><div id="results"></div><p class="muted">Jika Chrome mendukung instalasi, tombol Install akan tersedia. Jika tidak, buka menu Chrome dan pilih Install app / Add to Home Screen.</p><button id="install" hidden>Install App</button><p><a href="./?page=projecthub" style="color:#d7b97c">Buka Project Hub</a></p></div><script>
let promptEvent=null;const result=document.getElementById("results");const add=(label,ok)=>{const line=document.createElement("div");line.className="row "+(ok?"ok":"fail");line.textContent=(ok?"✓ ":"✕ ")+label;result.appendChild(line;};
(async()=>{for(const file of ["manifest.webmanifest","icon-192.png","icon-512.png","service-worker.js"]){try{let x=await fetch("./"+file,{cache:"no-store"});add(file+" — HTTP "+x.status,x.ok);}catch(e){add(file+" — "+e.message,false);}}if("serviceWorker" in navigator){try{const reg=await navigator.serviceWorker.register("./service-worker.js",{scope:"./"});add("Service Worker: "+reg.scope,true);}catch(e){add("Service Worker: "+e.message,false);}}})();
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();promptEvent=e;document.getElementById("install").hidden=false;});document.getElementById("install").addEventListener("click",()=>{if(promptEvent){promptEvent.prompt();promptEvent=null;document.getElementById("install").hidden=true;}});
</script></body></html>
